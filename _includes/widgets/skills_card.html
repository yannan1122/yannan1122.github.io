<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <div class="mx-2 my-1">
                    <h6>Technical Skills</h6>
                    <div class="row">
                        {% for item in site.data.profile.skills %}
                        <div class="col-md-6 mb-3">
                            <div class="small"><strong>{{ item.name }}</strong></div>
                            <div class="small text-muted">{{ item.detail }}</div>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
